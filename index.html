<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vận hành sàn</title>
<style>
/* Trang điện thoại app Lấy data ngày Sàn TMĐT (v21) — 5 menu đáy: Phân tích · Quảng cáo · Hộp thư · Sổ lệnh · Kết nối */
:root{--bg:#f3f5f2;--card:#fff;--line:#dde3dd;--fg:#1d2a20;--mut:#5f6d62;--acc:#15803d;--acc-soft:#e3f2e8;--ok:#15803d;
 --warn:#b7791f;--warn-soft:#fdf3dc;--bad:#c0392b;--bad-soft:#fbe5e2;--gray:#8a948c;
 --s1:#15803d;--s2:#5fb67f;--s3:#b9dcc4;--s4:#0f5a2b;--s5:#8fcca4;--s6:#dcefe2;
 --f:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#121814;--card:#1a221c;--line:#2c372f;--fg:#e4ece6;--mut:#9aa89e;--acc:#3fae68;--acc-soft:#1d3426;
 --ok:#3fae68;--warn:#e0b04a;--warn-soft:#3a3018;--bad:#e2685a;--bad-soft:#3d1f1b;--gray:#7d887f;
 --s1:#3fae68;--s2:#2d7d4b;--s3:#1f5233;--s4:#7fd19e;--s5:#4a9b68;--s6:#163b25;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f);display:flex;flex-direction:column}
.ah{padding:calc(env(safe-area-inset-top,0px) + 8px) max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));background:var(--card);border-bottom:1px solid var(--line)}
.ah b{font-size:16px}
.may{font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center;cursor:pointer}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.d-ok{background:var(--ok)}.d-warn{background:var(--warn)}.d-bad{background:var(--bad)}.d-gray{background:var(--gray)}
main{flex:1;overflow-y:auto;padding:12px max(12px,env(safe-area-inset-right,0px)) 18px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.c h4{margin:0 0 6px;font-size:13.5px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px}
.row+.row{margin-top:6px}
.sm{font-size:12px;color:var(--mut)}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--ok)}.dn{color:var(--bad)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11.5px;padding:1px 7px;border-radius:5px;background:var(--acc-soft);color:var(--acc);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.w{background:var(--warn-soft);color:var(--warn)}.chip.b{background:var(--bad-soft);color:var(--bad)}.chip.g{background:var(--line);color:var(--mut)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:13px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:7px 11px;cursor:pointer}
button.x{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.r{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{border:0;background:none;border-radius:0;padding:8px 0 6px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button .i{font-size:18px;line-height:1}
nav button.on{color:var(--acc);font-weight:700}
.badge{position:absolute;top:3px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;border-radius:99px;padding:0 5px;font-weight:700}
.filt{display:flex;gap:5px;overflow-x:auto;flex:none}
.filt button{white-space:nowrap;font-size:12.5px;padding:5px 11px;border-radius:99px}
.filt button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.kpi4{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kpi4 div{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 9px}
.kpi4 span{font-size:11px;color:var(--mut);display:block}
.kpi4 b{font-size:18px;font-variant-numeric:tabular-nums}
.kpi4 i{font-style:normal;font-size:11px;margin-left:4px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center}
.kpi b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.kpi span{font-size:10.5px;color:var(--mut)}
.bars{display:grid;gap:8px;align-items:end;height:120px;margin-top:6px;border-bottom:1px solid var(--line)}
.bar{display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden;cursor:pointer;min-height:2px}
.bar.sel{outline:2px solid var(--fg);outline-offset:1px}
.bl,.bv{display:grid;gap:8px;font-size:10.5px;text-align:center;font-variant-numeric:tabular-nums}
.bl{color:var(--mut)}.bv{font-weight:600}
.lg{display:flex;gap:10px;font-size:11.5px;color:var(--mut);margin-top:6px;flex-wrap:wrap}
.lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.fn{display:flex;flex-direction:column;gap:5px;align-items:center}
.fn div{height:28px;border-radius:5px;background:var(--acc);color:#fff;font-size:12px;display:flex;justify-content:space-between;align-items:center;padding:0 10px;font-variant-numeric:tabular-nums}
.fr{font-size:11px;color:var(--mut)}
.tb{overflow-x:auto}
.tb table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
.tb th,.tb td{padding:5px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tb th:first-child,.tb td:first-child{text-align:left}
.tb th{color:var(--mut);font-weight:600;font-size:11px}
.tb tr.t td{font-weight:700;border-bottom:0}
details.c summary{cursor:pointer;list-style:none}
details.c summary::-webkit-details-marker{display:none}
details.c[open] summary{margin-bottom:8px}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:12.5px;font-variant-numeric:tabular-nums}
.kv span:nth-child(odd){color:var(--mut)}
.sub{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);font-weight:700;margin:10px 0 4px}
.sl{border-left:3px solid var(--line)}
.sl.ok{border-left-color:var(--ok)}.sl.w{border-left-color:var(--warn)}.sl.b{border-left-color:var(--bad)}.sl.g{border-left-color:var(--gray)}
.meta{font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.ca{display:grid;grid-template-columns:84px 1fr;gap:5px 10px;font-size:13px;align-items:start}
.ca .t{font-variant-numeric:tabular-nums;font-weight:600}
.on-ca{background:var(--acc-soft);border-color:var(--acc)}
.o6{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.o6 div{border:1px solid var(--line);border-radius:8px;padding:5px 7px;font-size:11px;background:var(--card);min-width:0}
.o6 div b{display:block;font-size:12px}
.o6 .xong{background:var(--line);color:var(--mut)}.o6 .dang{border-color:var(--acc);background:var(--acc-soft)}
.chat{display:flex;flex-direction:column;gap:5px;font-size:13px;max-height:340px;overflow-y:auto}
.chat div{max-width:84%;padding:6px 9px;border-radius:10px;white-space:pre-wrap;word-break:break-word}
.chat .k{background:var(--line);align-self:flex-start}.chat .s{background:var(--acc);color:#fff;align-self:flex-end}
.chat .h{align-self:center;font-size:11px;color:var(--mut);background:none;padding:0}
.chat small{display:block;font-size:10px;opacity:.75}
textarea{font:inherit;font-size:14px;width:100%;min-height:72px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--card);color:var(--fg)}
.toast{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);font-size:13px;padding:10px 12px;border-radius:9px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.confirm{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:30}
.confirm .box{background:var(--card);width:100%;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;font-size:14px}
.trong{padding:30px 10px;text-align:center;color:var(--mut)}
/* v21 · kỳ + Top 10 */
.filt.s button{font-size:11.5px;padding:3px 9px}
.top{display:flex;flex-direction:column}
.tp{display:grid;grid-template-columns:20px 1fr auto;gap:2px 8px;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tp:last-child{border-bottom:0}
.tp .h{font-weight:700;color:var(--mut);font-size:12px;padding-top:1px}
.tp .n{font-size:12.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
.tp .g{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;font-size:13px}
.tp .m{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums;align-items:center}
.tp .m b{font-weight:600;color:var(--fg)}
.tp .m b.hx{color:var(--ok)}.tp .m b.hd{color:var(--bad)}
.tp .x{grid-column:2/4;font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.thead{display:flex;gap:6px;font-size:11px;color:var(--mut);align-items:center;flex-wrap:wrap}
.thead button{font-size:11px;padding:2px 7px;border-radius:99px}
.thead button.on{border-color:var(--acc);color:var(--acc);font-weight:700}
.tu{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.tu input{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:7px;padding:4px 6px;background:var(--card);color:var(--fg)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="ah"><b id="tde">Phân tích</b><div class="may" id="may" onclick="go('kn')"><span class="dot d-gray"></span>Đang tải…</div></div>
<main id="body"><div class="trong">Đang tải hiện trạng từ Sheet…</div></main>
<div class="toast" id="toast"></div>
<nav id="nav">
 <button data-t="pt" class="on"><span class="i">▤</span>Phân tích</button>
 <button data-t="qc"><span class="i">●</span>Quảng cáo</button>
 <button data-t="ht"><span class="i">✉</span>Hộp thư<span class="badge" id="b_ht" hidden></span></button>
 <button data-t="sl"><span class="i">☰</span>Sổ lệnh<span class="badge" id="b_sl" hidden></span></button>
 <button data-t="kn"><span class="i">⇄</span>Kết nối<span class="badge" id="b_kn" hidden></span></button>
</nav>
<script>
/* ===== cầu nối: google.script.run trên Apps Script; mở file cục bộ thì dùng window.GIA_LAP (thử) ===== */
// v24: mở từ GitHub Pages (ngoài Google) thì gọi Apps Script bằng fetch, không gửi cookie Google -> không dính lỗi nhiều tài khoản
const API_URL = 'https://script.google.com/macros/s/AKfycbxl314NjvuvPKN62olKaF3M6r_sACsqXItbspLxW-N-PMfpG5I2_diGc00N_Qt-QMooSA/exec';
const API = {
  goi(ham, args, ok, loi) {
    const hong = e => {
      const m = String(e && e.message || e);
      if (/CAN_MAT_KHAU|SAI_MAT_KHAU|KHOA_TAM/.test(m)) return hoiMatKhau(m);
      (loi || baoLoi)(e);
    };
    if (typeof google !== 'undefined' && google.script) {
      let r = google.script.run.withSuccessHandler(ok).withFailureHandler(hong);
      r[ham].apply(r, args.concat([MK]));
    } else if (window.GIA_LAP) {
      setTimeout(() => { try { ok(window.GIA_LAP[ham].apply(null, args)); } catch (e) { hong(e); } }, 150);
    } else {
      fetch(API_URL, { method: 'POST', credentials: 'omit', body: JSON.stringify({ loai: 'dt', ham: ham, args: args.concat([MK]) }) })
        .then(r => r.json())
        .then(o => o && o.ok ? ok(o.kq) : hong(new Error(o && o.loi || 'Không đọc được trả lời')))
        .catch(e => hong(new Error('Không kết nối được Apps Script: ' + (e && e.message || e))));
    }
  }
};
/* ===== v23 đăng nhập Team: tài khoản (nếu có) + mật khẩu; chủ Sheet đăng nhập Google thì không hỏi ===== */
let MK = ''; try { MK = localStorage.getItem('ttdh_dn') || ''; } catch (e) { }
let dangHoiMK = false;
function dangXuat() { MK = ''; try { localStorage.removeItem('ttdh_dn'); } catch (e) { } hoiMatKhau(''); }
function hoiMatKhau(m) {
  clearTimeout(hen);
  if (dangHoiMK) return; dangHoiMK = true;
  const loiTxt = /KHOA_TAM/.test(m) ? 'Sai nhiều lần — đợi 15 phút rồi thử lại.' : /SAI_MAT_KHAU/.test(m) ? 'Sai tài khoản hoặc mật khẩu.' : '';
  let cu = {}; try { cu = JSON.parse(MK || '{}'); } catch (e) { }
  const d = document.createElement('div'); d.className = 'confirm';
  const st = 'width:100%;font-size:16px;padding:10px;margin:6px 0;box-sizing:border-box';
  d.innerHTML = `<div class="box"><b>Đăng nhập</b><div>Tài khoản và mật khẩu do Leader cấp. Không có tài khoản thì để trống ô đầu.</div>
    <input id="tk_o" placeholder="Tài khoản (nếu có)" autocomplete="username" autocapitalize="none" style="${st};margin-top:10px" value="${esc(cu.tk || '')}">
    <input id="mk_o" type="password" placeholder="Mật khẩu" autocomplete="current-password" style="${st}">
    <div id="mk_l" style="color:var(--bad);min-height:1.2em">${esc(loiTxt)}</div>
    <div class="btns"><button class="x" id="mk_ok">Vào</button></div></div>`;
  document.body.appendChild(d);
  const t = d.querySelector('#tk_o'), o = d.querySelector('#mk_o'); (cu.tk ? o : t).focus();
  const vao = () => {
    const v = o.value.trim(); if (!v) return;
    MK = JSON.stringify({ tk: t.value.trim(), mk: v }); try { localStorage.setItem('ttdh_dn', MK); } catch (e) { }
    d.remove(); dangHoiMK = false; tai();
  };
  d.querySelector('#mk_ok').onclick = vao;
  o.onkeydown = e => { if (e.key === 'Enter') vao(); };
  t.onkeydown = e => { if (e.key === 'Enter') o.focus(); };
}
const TEN = {pt:'Phân tích', qc:'Quảng cáo', ht:'Hộp thư', sl:'Sổ lệnh', kn:'Kết nối'};
const TT_LENH = {'chờ':['Chờ máy nhận','g'],'đã nhận':['Máy đã nhận','g'],'đang làm':['Máy đang làm','g'],'xong':['Xong','ok'],
  'lỗi':['Lỗi','b'],'từ chối':['Máy từ chối','w'],'hết hạn':['Hết hạn','w']};
let S = {tab:'pt', loc:'Tất cả', htm:'tq', ngay:-1, khach:null, ls:{}, cho:{}, ky:'rt', shop:'Tất cả', xep:'gmv', mo:-1, tc:null, rtCho:null};
let G = null, D = null, MAY = '', LUC = null, TRE = 0, LENH = [];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tr = x => x == null ? '—' : (x / 1e6).toLocaleString('vi-VN', {minimumFractionDigits:2, maximumFractionDigits:2});
const so = x => x == null ? '—' : Number(x).toLocaleString('vi-VN');
const fk = x => x == null ? '—' : (x >= 1000 ? (x / 1000).toLocaleString('vi-VN', {maximumFractionDigits:1}) + 'k' : String(x));
const pc = (a, b) => b ? (a / b * 100).toLocaleString('vi-VN', {maximumFractionDigits:2}) + '%' : '—';
function dl(a, b) { if (a == null || !b) return ''; const p = (a - b) / b * 100; return `<i class="${p >= 0 ? 'up' : 'dn'}">${p >= 0 ? '▲' : '▼'}${Math.abs(p).toFixed(0)}%</i>`; }
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3000); }
function baoLoi(e) { toast('Lỗi: ' + (e && e.message || e)); }
function hoi(msg, nut, ok) {
  const d = document.createElement('div'); d.className = 'confirm';
  d.innerHTML = `<div class="box"><b>Xác nhận</b><div>${msg}</div><div class="btns"><button class="x" id="cy">${nut || 'Gửi lệnh'}</button><button id="cn">Thôi</button></div></div>`;
  document.body.appendChild(d); d.querySelector('#cn').onclick = () => d.remove(); d.querySelector('#cy').onclick = () => { d.remove(); ok(); };
}
function lenh(loai, ts, moTa, sau) {
  hoi(moTa, 'Gửi lệnh', () => API.goi('dtGuiLenh', [MAY, loai, ts || {}], ma => {
    toast('Đã gửi lệnh. Máy nhận trong ≤ 20 giây (máy phải bật, app mở).');
    S.cho[ma] = loai; nhanh(); if (sau) sau(ma);
  }));
}
/* ===== tải hiện trạng ===== */
let hen = null, nhanhDen = 0;
function nhanh() { nhanhDen = Date.now() + 90e3; tai(); }
function tai() {
  API.goi('dtHienTrang', [], s => {
    G = JSON.parse(s); LENH = G.lenh || [];
    const m = (G.may || [])[0];
    if (m) { MAY = m.may; LUC = m.luc; try { D = m.ht ? JSON.parse(m.ht) : D; } catch (e) { } }
    const bg = new Date(G.bay_gio.replace(' ', 'T')), lc = LUC ? new Date(String(LUC).replace(' ', 'T')) : null;
    TRE = lc ? Math.max(0, (bg - lc) / 60e3) : 999;
    ve();
  }, e => { $('#may').innerHTML = '<span class="dot d-bad"></span>Không đọc được Sheet: ' + esc(e && e.message || e); });
  clearTimeout(hen); hen = setTimeout(tai, Date.now() < nhanhDen ? 5000 : 20000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) tai(); });
/* ===== khung ===== */
function ve() {
  const mat = TRE > 3;
  $('#may').innerHTML = !D ? '<span class="dot d-gray"></span>Máy chưa gửi hiện trạng lần nào — bật "Đồng bộ điện thoại" trong app (tab Sổ lệnh)' :
    mat ? `<span class="dot d-bad"></span><b style="color:var(--bad)">Máy ${esc(MAY)} mất liên lạc từ ${esc(String(LUC).slice(11,16))}</b>&nbsp;· ${Math.round(TRE)} phút` :
    `<span class="dot d-ok"></span>${esc(MAY)} · app ${esc(D.ban || '')} · gửi lúc ${esc(String(LUC).slice(11,16))}`;
  if (G && G.nguoi && G.nguoi !== 'Chủ Sheet') $('#may').insertAdjacentHTML('beforeend',
    ` · ${esc(G.nguoi)} · <u onclick="event.stopPropagation();dangXuat()">Đăng xuất</u>`);
  $('#tde').textContent = TEN[S.tab];
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab));
  const sl = D && D.so_lenh && D.so_lenh.tk ? D.so_lenh.tk.cho_duyet : 0;
  dat('#b_sl', sl); dat('#b_ht', D && D.hop_thu && D.hop_thu.tin ? D.hop_thu.tin.filter(canXL).length : 0);
  let kn = mat ? 1 : 0;
  if (D && D.ket_noi && D.ket_noi.shops) kn += D.ket_noi.shops.filter(s => s.chay && s.tt !== 'ket_noi').length + (D.ket_noi.nhip || []).filter(n => n.tt === 'lo').length;
  dat('#b_kn', kn);
  if (!D) { $('#body').innerHTML = '<div class="trong">Chưa có dữ liệu từ máy.</div>'; return; }
  const giu = $('#body').scrollTop, tl = $('#tl'), nd = tl ? tl.value : null;
  const tu = $('#tc_tu'), den = $('#tc_den'), vtu = tu ? tu.value : null, vden = den ? den.value : null;
  $('#body').innerHTML = V[S.tab]();
  $('#body').scrollTop = giu;
  if (nd != null && $('#tl')) $('#tl').value = nd;
  if (vtu && $('#tc_tu')) { $('#tc_tu').value = vtu; $('#tc_den').value = vden; }
}
function dat(s, n) { const b = $(s); b.textContent = n; b.hidden = !n; }
function go(t) { S.tab = t; S.khach = null; ve(); $('#body').scrollTop = 0; }
document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.t));

  const K = D.ky && D.ky[S.ky]; if (!K || K.loi) return {loi: K || {loi:'Máy chưa gửi số kỳ này (app cũ hơn v21?)'}};
  return {shops:K.shops, top:K.top, nhan:K.nhan, k:K};

function tongKy(sh, rt) {
  const t = {gmv:0, dt:0, cp:0, gmv0:0, dt0:0, cp0:0, dr:0, cr:0, dr0:0, cr0:0, coCp:false, coCp0:false, thieu:[], loi:[]};
  Object.entries(sh).forEach(([vt, s]) => {
    if (S.shop !== 'Tất cả' && vt !== S.shop) return;
    if (s.loi_shop) { t.loi.push(vt + ': ' + s.loi_shop); return; }
    t.gmv += s.gmv || 0; t.dt += s.dt || 0; t.gmv0 += s.gmv0 || 0; t.dt0 += s.dt0 || 0;
    if (s.cp != null) { t.cp += s.cp; t.coCp = true; } else t.thieu.push(vt);
    if (s.cp0 != null) { t.cp0 += s.cp0; t.coCp0 = true; }
    if (rt) { if (s.cp && s.dt != null) { t.dr += s.dt; t.cr += s.cp; } }
    else { t.dr += s.dtr || 0; t.cr += s.cpr || 0; t.dr0 += s.dtr0 || 0; t.cr0 += s.cpr0 || 0; }
  });
  t.roi = t.cr ? t.dr / t.cr : null; t.roi0 = t.cr0 ? t.dr0 / t.cr0 : null; return t;
}
function topKy(rows) {
  let ds = (rows || []).filter(r => S.shop === 'Tất cả' || r[0] === S.shop)
    .map(r => ({shop:r[0], ten:r[1], gmv:r[2], don:r[3], ht:r[4], nh:r[5], gh:r[6], kenh:r[7]}))
    .filter(x => x.gmv > 0).sort((a, b) => b.gmv - a.gmv).slice(0, 10);
  ds.forEach(x => { x.ctr = x.ht ? x.nh / x.ht : 0; x.cd = x.nh ? x.don / x.nh : 0; x.aov = x.don ? x.gmv / x.don : 0; });
  ['ctr','cd'].forEach(k => { const c = ds.filter(x => x[k] > 0).sort((a, b) => b[k] - a[k]);
    c.forEach((x, i) => { x[k + 'H'] = i < 3 ? 'hx' : (c.length > 3 && i >= c.length - 3 ? 'hd' : ''); }); });
  return ds.sort((a, b) => b[S.xep] - a[S.xep]);
}

function moKhach(ma) { S.khach = ma; ve(); $('#body').scrollTop = 0; if (!S.ls[ma]) taiLS(ma); }

function theoDoi(m, xong, lan) {
  lan = lan || 0;
